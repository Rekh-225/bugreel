name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb
      - run: npm run typecheck
      - run: npm run build
      - name: Run verification suite (headed browsers under Xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm test
        env:
          BUGREEL_TEST_PRODUCTION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
